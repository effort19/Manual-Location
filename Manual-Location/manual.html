
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manual Location Search</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

<div class="container mt-4">

    <div class="mb-2">

        <!-- ADDRESS LABEL + SEARCH ICON -->
        <div class="d-flex align-items-center justify-content-between mb-1">

            <label
                for="address"
                class="form-label small mb-0"
            >
                Address
            </label>

            <!-- Manual Search Button -->
            <button
                type="button"
                id="manualSearchLocationBtn"
                class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center"
                style="width: 30px; height: 30px;"
                data-bs-toggle="modal"
                data-bs-target="#manualLocationModal"
                title="Search location manually"
            >
                <i class="bi bi-search"></i>
            </button>

        </div>

        <!-- ADDRESS SELECT -->
        <select
            id="address"
            class="form-select form-select-sm"
        >
            <option value="" selected>
                Select address
            </option>
        </select>

    </div>


    <!-- =====================================================
         MANUAL LOCATION MODAL
         ===================================================== -->

    <div
        class="modal fade"
        id="manualLocationModal"
        tabindex="-1"
        aria-labelledby="manualLocationModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="manualLocationModalLabel"
                    >
                        <i class="bi bi-search me-2"></i>
                        Search Location
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- BODY -->
                <div class="modal-body">

                    <!-- SEARCH INPUT -->
                    <div class="input-group">

                        <input
                            type="text"
                            id="manualLocationSearch"
                            class="form-control"
                            placeholder="Search city, town, barangay..."
                            autocomplete="off"
                        style="text-transform: capitalize;">

                        <button
                            type="button"
                            id="searchLocationBtn"
                            class="btn btn-primary"
                        >
                            <i class="bi bi-search me-1"></i>
                            Search
                        </button>

                    </div>


                    <!-- STATUS -->
                    <div
                        id="locationSearchStatus"
                        class="small text-muted mt-2"
                    ></div>


                    <!-- RESULTS -->
                    <div
                        id="locationSearchResults"
                        class="list-group mt-3"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
<!-- YOUR MANUAL LOCATION JS -->
<script src="manual.js"></script>

</body>
</html>
